
# ── miraddo.com — personal site ─────────────────────────────────────────
# Static build (Astro). The host directory /opt/miraddo is mounted read-only at
# /srv/miraddo-root, and `current` inside it is a relative symlink to the active
# release under releases/. Deploys swap that symlink, which is atomic and — 
# unlike replacing the served directory itself — does not break the bind mount,
# because the mounted inode never changes.
#
# Behind the Cloudflare proxy in "Full" mode, same as fluentdeutsch.com:
# Cloudflare presents its own public certificate to browsers and accepts
# this locally-signed cert on the Cloudflare->origin hop. Public ACME is
# not used here because the Cloudflare proxy would block the challenge.
#
# Before this block existed, miraddo.com had no matching site in Caddy, so
# the origin TLS handshake failed and Cloudflare returned 525.
miraddo.com {
	tls internal
	encode gzip zstd
	root * /srv/miraddo-root/current
	file_server

	# Long-lived hashed assets vs. always-revalidate HTML.
	@assets path /_astro/*
	header @assets Cache-Control "public, max-age=31536000, immutable"
	# `*/` matches /, /about/ and /notes/colophon/ alike. The previous
	# `*.html /` matched only the bare root, so every directory URL — which is
	# every page — shipped with no Cache-Control at all.
	@html path *.html */
	header @html Cache-Control "public, max-age=0, must-revalidate"
	# Fonts and images have stable, unhashed names, so they cannot be immutable;
	# a week is long enough to help and short enough to correct a mistake.
	@static path /fonts/* /og.png /favicon.svg
	header @static Cache-Control "public, max-age=604800"

	header {
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		X-Frame-Options "SAMEORIGIN"
	}

	handle_errors {
		@notfound expression {err.status_code} == 404
		handle @notfound {
			rewrite * /404.html
			file_server
		}
	}
}

# www redirects to the bare domain. Harmless if the DNS record is absent.
www.miraddo.com {
	tls internal
	redir https://miraddo.com{uri} permanent
}
